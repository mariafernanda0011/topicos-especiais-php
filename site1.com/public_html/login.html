<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <form class="container pt-4 p-4 mx-auto" style="max-width: 500px; min-height: 500px;" action="login.php"
        method="POST">
        <div class="card p-5 shadow">
            <header class="text-center">
                <img src="/assets/logo IF.png" class="img-fluid" style="max-width: 100px;" alt="Logo do IFNMG">
            </header>

            <section class="mb-3">
                <label class="fw-bold">Email: </label>
                <input type="email" class="form-control" placeholder="seuemail@gmail.com" name="email" id="email"
                    value="" required>
            </section>

            <section class="mb-3">
                <label class="fw-bold">Senha: </label>
                <input type="password" class="form-control" placeholder="******" name="senha" id="senha" value=""
                    required>
            </section>

            <input type="submit" class="btn btn-primary btn-lg btn-block fw-bold mb-3" value="Entrar" />
            <a href="cadastro.html" class="btn btn-secondary btn-lg btn-block fw-bold">
                Fazer Cadastro
            </a>

        </div>
    </form>

</body>

</html>
