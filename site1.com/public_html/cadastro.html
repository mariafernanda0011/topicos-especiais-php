<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>    
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>

</head>

<body>
    <form class="container pt-4" action="cadastro.php" method="POST">

        <div class="card p-5">
            <header class="text-center">
                <img src="/assets/logo IF.png" class="img-fluid" style="max-width: 100px;" alt="Logo do IFNMG">
            </header>

            <section class="mb-3">
                <label class="fw-bold">Nome completo: </label>
                <input type="text" class="form-control" name="nome" id="nome" value="" required>
            </section>

            <section class="mb-3">
                <label class="fw-bold">E-mail: </label>
                <input type="email" class="form-control" placeholder="seuemail@gmail.com" name="email" id="email" value="" required>
            </section>

            <section class="mb-3">
                <label class="fw-bold">Senha: </label>
                <input type="password" class="form-control" placeholder="******" name="senha" id="senha" value="" required>
            </section>

            <section class="mb-3">
                <label class="fw-bold">Idade: </label>
                <input type="number" class="form-control" name="idade" id="idade" min="0" max="120" step="1" required>
            </section>

            <section class="mb-3">
                <label class="fw-bold">Gênero: </label>
                <select name="genero" class="form-control" id="genero" required>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outro">Prefiro não opinar</option>
                </select>
            </section>

            <section class="mb-3">
                <label class="fw-bold">Cidade: </label>
                <input type="text" class="form-control" name="cidade" id="cidade" value="" required>
            </section>

            <section class="mb-3">
                <label class="fw-bold">Estado: </label>
                <select name="estado" id="estado" class="form-control" required>
                    <option selected disabled>Selecione...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </section>

            <section class="form-check mb-5">
                <input class="form-check-input" type="checkbox" name="termos" id="termos" value="aceito" required>
                <label class="form-check-label fw-bold" for="termos">Aceitar termos de Uso</label>
            </section>

            <br>

            <footer class="d-flex justify-content-end gap-2">
                <input type="submit" class="btn btn-primary fw-bold" value="Enviar" />
                <input type="reset" class="btn btn-primary fw-bold" value="Limpar Formulário" />
            </footer>
        </div>
    </form>

</body>

</html>
